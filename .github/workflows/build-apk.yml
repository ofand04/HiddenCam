name: HiddenCam Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Build the working debug APK for release distribution
        run: |
          gradle --no-daemon --stacktrace clean :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "HiddenCam-release-${GITHUB_RUN_NUMBER}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "hiddencam-build-${{ github.run_number }}"
          name: "HiddenCam Release ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: HiddenCam-release-${{ github.run_number }}.apk
